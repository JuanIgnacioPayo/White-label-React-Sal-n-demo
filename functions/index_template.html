  <script>
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('/assets/')) {
        console.warn("Script chunk failed to load. Recargando versión actual...");
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for(let r of regs) r.unregister();
          });
        }
        var last = sessionStorage.getItem('last_script_recovery');
        var now = Date.now();
        if (!last || (now - parseInt(last, 10)) > 4000) {
          sessionStorage.setItem('last_script_recovery', String(now));
          var url = new URL(window.location.href);
          url.searchParams.set('v', String(now));
          window.location.replace(url.toString());
        }
      }
    }, true);

    function removeAppInitialLoader() {
      var l = document.getElementById('app-initial-loader');
      if (l) {
        l.style.opacity = '0';
        setTimeout(function() {
          if (l && l.parentNode) l.parentNode.removeChild(l);
        }, 400);
      }
    }
    window.addEventListener('force-clear-loader', removeAppInitialLoader);
    setTimeout(removeAppInitialLoader, 5000);
  </script>

  <div id="app-initial-loader" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #ffffec 0%, #fdfbf5 100%);

          border-top-color: #948924;

      <!-- Estilos CSS Inyectados directamente para ejecución instantánea -->
      <style>
        @keyframes loaderPulse {
          0% {
            transform: scale(0.95);
            filter: drop-shadow(0 4px 12px rgba(148, 137, 36, 0.15));
          }
          50% {
            transform: scale(1.05);
            filter: drop-shadow(0 8px 20px rgba(148, 137, 36, 0.25));
          }
          100% {
            transform: scale(0.95);
            filter: drop-shadow(0 4px 12px rgba(148, 137, 36, 0.15));
          }
        }
        @keyframes loaderFadeInUp {
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        @keyframes loaderFadeIn {
          to {
            opacity: 1;
          }
        }
        @keyframes loaderSpin {

          }
        }

  <script>
    // Cargar configuración dinámica de precarga desde Firebase Realtime Database
    fetch('https://melishare-redirect-payo-default-rtdb.firebaseio.com/config/loader.json')
      .then(res => res.json())
      .then(data => {
        if (!data) return;
        window.__LOADER_CONFIG__ = data;
        
        if (data.showLogo && data.logoUrl) { // Compatibilidad con logoUrl
          const container = document.getElementById('loader-title-container');
          if (container) {
            container.innerHTML = '<img src="' + data.logoUrl + '" alt="Logo" style="max-height: 80px; opacity: 0; animation: loaderFadeInUp 0.8s forwards cubic-bezier(0.16, 1, 0.3, 1); animation-delay: 0.2s;" />';
          }
        } else if (data.title) {
          const titleEl = document.getElementById('loader-title');
          if (titleEl) titleEl.innerText = data.title;
        }
      })
      .catch(err => console.warn('Error fetching loader config:', err));

    // También intentar cargar el nombre del sitio desde appSettings por si data.title no está
    fetch('https://melishare-redirect-payo-default-rtdb.firebaseio.com/appSettings/siteName.json')
      .then(res => res.json())
      .then(name => {
        if (name && typeof name === 'string') {
          const titleEl = document.getElementById('loader-title');
          if (titleEl) titleEl.innerText = name;
        }
      })
      .catch(err => console.warn('Error fetching siteName:', err));
  </script>
